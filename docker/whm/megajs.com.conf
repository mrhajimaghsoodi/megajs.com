# Apache reverse proxy for MEGA JS (main site)
# Install via WHM → Apache Configuration → Include Editor
#   → Pre VirtualHost Include  OR  per-domain include for megajs.com
#
# Requires: mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_ssl, mod_rewrite
# Docker must be listening on:
#   127.0.0.1:13000 (web)  127.0.0.1:14000 (api)

<IfModule mod_proxy.c>
  ProxyRequests Off
  ProxyPreserveHost On
  ProxyTimeout 120

  # Nest API under /api
  ProxyPass        /api  http://127.0.0.1:14000/api
  ProxyPassReverse /api  http://127.0.0.1:14000/api

  # Next.js web app
  ProxyPass        /     http://127.0.0.1:13000/
  ProxyPassReverse /     http://127.0.0.1:13000/

  # Next.js / nested upgrades (safe no-op if unused)
  RewriteEngine On
  RewriteCond %{HTTP:Upgrade} =websocket [NC]
  RewriteRule /(.*)           ws://127.0.0.1:13000/$1 [P,L]
</IfModule>

# If this vhost still serves WordPress from DocumentRoot, DISABLE/remove WP
# DocumentRoot handlers for this domain before enabling the proxy, or use a
# dedicated cPanel account / subdomain whose DocumentRoot is empty.
