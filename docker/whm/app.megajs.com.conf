# Apache reverse proxy for soft-launch subdomain app.megajs.com
# Same rules as megajs.com.conf — use while WordPress still owns the apex.

<IfModule mod_proxy.c>
  ProxyRequests Off
  ProxyPreserveHost On
  ProxyTimeout 120

  ProxyPass        /api  http://127.0.0.1:14000/api
  ProxyPassReverse /api  http://127.0.0.1:14000/api

  ProxyPass        /     http://127.0.0.1:13000/
  ProxyPassReverse /     http://127.0.0.1:13000/

  RewriteEngine On
  RewriteCond %{HTTP:Upgrade} =websocket [NC]
  RewriteRule /(.*)           ws://127.0.0.1:13000/$1 [P,L]
</IfModule>
