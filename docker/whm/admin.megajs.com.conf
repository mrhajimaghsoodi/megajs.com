# Apache reverse proxy for MEGA JS Admin
# Domain: admin.megajs.com → 127.0.0.1:13001
#
# Create subdomain/addon in WHM/cPanel first, issue SSL (AutoSSL), then include this.

<IfModule mod_proxy.c>
  ProxyRequests Off
  ProxyPreserveHost On
  ProxyTimeout 120

  ProxyPass        /  http://127.0.0.1:13001/
  ProxyPassReverse /  http://127.0.0.1:13001/

  RewriteEngine On
  RewriteCond %{HTTP:Upgrade} =websocket [NC]
  RewriteRule /(.*)           ws://127.0.0.1:13001/$1 [P,L]
</IfModule>
